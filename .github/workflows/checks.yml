name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check links, translations, and data
        run: python3 scripts/check_repository.py
      - name: Check generated website
        run: python3 scripts/build_site.py --check
      - name: Check offline tutorial
        run: python3 -m unittest discover -s examples -v
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
